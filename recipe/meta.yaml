{% set name = "iterative-telemetry" %}
{% set version = "0.0.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 7fde6111de6fa4acf5a95a6190cc9cc5d17d835a815f0a18ece201f6031f4ed6

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  skip: true  # [py<38]

requirements:
  host:
    - python
    - pip
    - setuptools_scm >=6.3.1
    - wheel
    - setuptools
  run:
    - python
    - requests
    - appdirs
    - filelock
    - distro

test:
  source_files:
    - tests
  imports:
    - iterative_telemetry
  requires:
    - pip
    - pytest
    - pytest-mock
  commands:
    - pip check
    - pytest -vv tests

about:
  home: https://github.com/iterative/telemetry-python
  summary: Common library to send usage telemetry
  description: |
    Common library to send usage telemetry,
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  doc_url: https://github.com/iterative/telemetry-python/blob/main/README.rst
  dev_url: https://github.com/iterative/telemetry-python

extra:
  recipe-maintainers:
    - pmrowla
    - shcheklein
    - casperdcl
    - mike0sv
